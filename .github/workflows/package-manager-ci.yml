name: package-manager-ci

# Dispatch-only on the sealed-package CI fork: the push / pull_request
# triggers would fire this workflow on the fork push. It is not a build target
# (its single job is disabled below), so it must never run on its own.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: false
    permissions:
      contents: read
    uses: fastify/workflows/.github/workflows/plugins-ci-package-manager.yml@v6
