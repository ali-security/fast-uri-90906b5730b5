name: Lock Threads

# Dispatch-only on the sealed-package CI fork: the monthly schedule would run
# issue/PR locking against the fork. Not a build target.
on:
  workflow_dispatch:

concurrency:
  group: lock

permissions:
  contents: read

jobs:
  lock-threads:
    permissions:
      issues: write
      pull-requests: write
    uses: fastify/workflows/.github/workflows/lock-threads.yml@v6
